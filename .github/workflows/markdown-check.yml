name: PrepHub Checks

on:
  push:
  pull_request:

jobs:
  app-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Lint app
        working-directory: app
        run: bun run lint
      - name: Build app
        working-directory: app
        run: bun run build
